<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Aurelia</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container flex items-center justify-between">
    <a href="index.html" class="logo">Aurelia <span>Tech</span></a>
    <nav class="nav flex items-center gap-4">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html" class="cart-btn">Cart <span class="cart-badge">0</span></a>
    </nav>
  </div>
</header>

<section class="container" style="padding-top:100px; padding-bottom:60px;">
  <h1 style="font-family:'Playfair Display',serif;font-size:clamp(3rem,7vw,6rem);letter-spacing:-0.04em;line-height:0.95;">The Collection</h1>
  <p style="color:var(--muted);margin-top:0.5rem;font-size:1.1rem;">Four objects. Engineered without compromise.</p>
</section>

<section class="container" style="padding-bottom:100px;">
  <div class="grid-3" id="shop-grid"></div>
</section>

<footer class="site-footer">
  <div class="container"><p>© 2026 Aurelia Tech.</p></div>
</footer>

<script src="js/data.js"></script>
<script>
  const grid = document.getElementById('shop-grid');
  grid.innerHTML = products.map(p => `
    <a href="product.html?id=${p.id}" class="card">
      <div class="card-img"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>
      <div class="card-body">
        <p class="small">${p.category}</p>
        <h3>${p.name}</h3>
        <p class="price">$${p.price.toLocaleString()}</p>
        <p style="font-size:0.9rem;color:var(--muted);">${p.desc}</p>
      </div>
    </a>
  `).join('');
</script>
<script src="js/cart.js"></script>
</body>
</html>
